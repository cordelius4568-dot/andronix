# Builds the aarch64 andronix binaries (Android build for Termux + the
# static Linux build that goes inside distros) and uploads them as a
# workflow artifact. Nothing is published anywhere else.
# Runs on a v* tag, or by hand from the Actions tab.
name: binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./...
      - run: go test ./...
        continue-on-error: true
      # The runner image has the NDK (the android build uses cgo).
      - name: Build aarch64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ci/build-go.sh
      - uses: actions/upload-artifact@v4
        with:
          name: andronix-aarch64
          path: |
            dist/andronix-android-aarch64
            dist/andronix-linux-aarch64
            dist/andronix-aarch64
            dist/SHA256SUMS
          if-no-files-found: error
